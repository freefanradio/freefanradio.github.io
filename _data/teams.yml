# Single source of truth for team pages (/teams/<slug>/).
# stations: use `id:` for a station in _stations/ (gets a Play button),
# or `name:` for a station we don't stream yet. `lang: fr` marks French.
# abbr: scoreboard code (ESPN abbreviation for NHL/NFL/NBA/MLB/MLS); espn_id: ESPN team id when the
# schedule needs it (MLS); tsdb: TheSportsDB team id (CFL scores).
# Add a team = add an entry here. Update `checked:` when you re-verify.

